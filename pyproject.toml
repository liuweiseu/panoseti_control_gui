[project]
name = "pseti-gui"
version = "0.2.0"
requires-python = ">=3.14"
dependencies = [
    "pyqt6",
    "pyqtgraph",
    "numpy",
    "panoseti-grpc>=0.4.17",
    "typer",
]

[project.scripts]
pseti-gui = "pseti_gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pseti_gui"]
